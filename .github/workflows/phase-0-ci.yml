name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated files, local databases and secrets
        shell: bash
        run: |
          set -euo pipefail
          prohibited='(^|/)(node_modules|venv|\.venv|__pycache__)/|\.pyc$|(^|/)\.env$|\.(sqlite|sqlite3|db)$'
          if git ls-files | grep -E "$prohibited"; then
            echo "Prohibited generated, secret, or local data files are tracked."
            exit 1
          fi

  design-system-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify canonical design tokens are synced
        run: node scripts/sync-design-tokens.mjs --check
      - name: Verify Phase 2 design-system adoption
        run: node scripts/verify-phase2-design-system-adoption.mjs

  uiux-fidelity-audit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify UI/UX fidelity audit evidence and honesty gate
        run: node scripts/verify-uiux-fidelity-audit.mjs

  journey-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Phase 12 cross-platform journey contracts
        run: node scripts/verify-phase12-journeys.mjs

  controlled-testing-readiness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Phase 13 controlled-testing readiness contract
        run: node scripts/verify-phase13-readiness.mjs

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      SECRET_KEY: phase-ci-only-not-for-production
      DEBUG: "False"
      DATABASE_SSL_REQUIRE: "False"
      INTERNAL_BROADCAST_TOKEN: phase-ci-internal-token
      PREBOOKING_CONTACT_BLOCK_ENABLED: "True"
      VERIFICATION_GATE_ENABLED: "True"
      VERIFICATION_DOCUMENT_KEY: "snaP0PH4qqXmhRi8cERh7mBG76PxuoM623onWZfPAmM="
      VERIFICATION_REVIEW_SLA_HOURS: "48"
      VERIFICATION_RETENTION_DAYS: "365"
      SABIPAY_ENABLED: "True"
      SABIPAY_COMMISSION_RATE: "0.10"
      SABIPAY_FREEZE_DAYS: "7"
      PAYSTACK_SECRET_KEY: "sk_test_phase7_ci_only"
      PAYSTACK_PUBLIC_KEY: "pk_test_phase7_ci_only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy
      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Backend journeys
        run: python manage.py test health accounts search posts notifications marketplace verification sabipay operations

  realtime-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExpressJs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ExpressJs/package-lock.json
      - run: npm ci
      - run: npm run check

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify canonical route access policy
        run: node scripts/verify-access-policy.mjs
      - name: Verify Phase 5 Client onboarding contract
        run: node scripts/verify-phase5-client-onboarding.mjs
      - name: TypeScript
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  browser-access-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_DJANGO_URL: http://127.0.0.1:3999
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:3998
      NEXT_PUBLIC_WAITLIST_URL: http://127.0.0.1:3997
      BROWSER_TEST_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build for browser regression
        run: npm run build
      - name: Start production web server
        shell: bash
        run: |
          npm run start -- -p 3100 > /tmp/sabiway-browser.log 2>&1 &
          echo $! > /tmp/sabiway-browser.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sabiway-browser.log
          exit 1
      - name: Verify protected redirect preserves return intent
        shell: bash
        run: |
          set -euo pipefail
          location=$(curl --silent --head 'http://127.0.0.1:3100/home?source=browser-regression' | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          case "$location" in
            */login?next=%2Fhome%3Fsource%3Dbrowser-regression) ;;
            *) echo "Unexpected redirect location: $location"; exit 1 ;;
          esac
      - name: Verify Client onboarding requires authentication
        shell: bash
        run: |
          set -euo pipefail
          location=$(curl --silent --head 'http://127.0.0.1:3100/onboarding/client?next=%2Fmarketplace' | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          case "$location" in
            */login?next=%2Fonboarding%2Fclient%3Fnext%3D%252Fmarketplace) ;;
            *) echo "Unexpected Client onboarding redirect: $location"; exit 1 ;;
          esac
      - name: Run headless Chromium access regression
        run: node scripts/browser-access-regression.mjs

  waitlist-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q WaitList

  mobile-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.x"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - repository-hygiene
      - design-system-check
      - uiux-fidelity-audit-check
      - journey-contract-check
      - controlled-testing-readiness-check
      - backend-check
      - realtime-check
      - frontend-check
      - browser-access-check
      - waitlist-syntax
      - mobile-check
    steps:
      - name: Require every Platform CI quality gate to succeed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.repository-hygiene.result }}" = "success"
          test "${{ needs.design-system-check.result }}" = "success"
          test "${{ needs.uiux-fidelity-audit-check.result }}" = "success"
          test "${{ needs.journey-contract-check.result }}" = "success"
          test "${{ needs.controlled-testing-readiness-check.result }}" = "success"
          test "${{ needs.backend-check.result }}" = "success"
          test "${{ needs.realtime-check.result }}" = "success"
          test "${{ needs.frontend-check.result }}" = "success"
          test "${{ needs.browser-access-check.result }}" = "success"
          test "${{ needs.waitlist-syntax.result }}" = "success"
          test "${{ needs.mobile-check.result }}" = "success"
          echo "Release Gate passed for ${GITHUB_SHA}."

  deployment-eligibility:
    name: Deployment Eligibility
    runs-on: ubuntu-latest
    needs: release-gate
    steps:
      - name: Record revision eligible for deployment verification
        run: |
          echo "Release Gate passed for ${GITHUB_SHA}."
          echo "This job does not assert that Vercel deployed this revision."
          echo "Post-merge deployment revision matching and smoke checks are still required before Rolling Green Baseline advancement."
