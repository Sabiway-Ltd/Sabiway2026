name: Phase 5 Mobile Lockfile

on:
  pull_request:
    paths:
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/phase5-mobile-lock.yml'

permissions:
  contents: write

jobs:
  generate-mobile-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Generate exact SDK 57 mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "chore: lock Phase 5 mobile dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
