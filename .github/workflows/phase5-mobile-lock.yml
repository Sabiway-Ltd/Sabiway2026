name: Phase 5 Mobile Lockfile

on:
  pull_request:
    paths:
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/phase5-mobile-lock.yml'

permissions:
  contents: read

jobs:
  generate-mobile-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Generate exact SDK 57 mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-mobile-package-lock
          path: mobile/package-lock.json
          retention-days: 1
