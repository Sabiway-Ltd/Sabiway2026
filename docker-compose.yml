version: "3.9"

services:
  # =======================
  # 🐍 Django Backend
  # =======================
  web:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: sabiway_web
    command: gunicorn sabiway.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DEBUG: "True"
      SECRET_KEY: "insecure-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web,sabiway-9wq4.onrender.com"

      # Google OAuth
      GOOGLE_CLIENT_ID: "62853499803-r7kkbq52ptk4u2j5mralkbbkquen4chh.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "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"

      # Resend API
      RESEND_API_KEY: "re_cV9BwHsi_GDtS6kPGHrTnJGpwD5Vf6HNQ"
      DEFAULT_FROM_EMAIL: "SabiWay <info@sabiway.com>"

      # URLs (use localhost for Google OAuth)
      BACKEND_URL: "http://localhost:8000"       # must match Google Cloud redirect URI
      FRONTEND_URL: "http://localhost:3000"      # user-facing frontend

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: "devqbjptr"
      CLOUDINARY_API_KEY: "233511915335819"
      CLOUDINARY_API_SECRET: "ZcbD-lTO22KamDmTWMhp-xPgLxU"

      # Database
      DB_ENGINE: "django.db.backends.mysql"
      DB_NAME: "sabiway_db"
      DB_USER: "sabiway_user"
      DB_PASSWORD: "sabiway_pass"
      DB_HOST: "db"
      DB_PORT: "3306"

  # =======================
  # 🟢 Express API
  # =======================
  express:
    build:
      context: ./ExpressJs
      dockerfile: Dockerfile
    container_name: sabiway_express
    volumes:
      - ./ExpressJs:/app
    ports:
      - "5000:5000"
    depends_on:
      - web
    environment:
      NODE_ENV: "production"
      DJANGO_API_URL: "http://localhost:8000"   # backend from host
      FRONTEND_URL: "http://localhost:3000"     # frontend accessible from host
      PORT: 5000
    command: ["node", "server.js"]

  # =======================
  # ⚛️ Next.js Frontend
  # =======================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sabiway_frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"

      # Internal service URLs (can still use Docker hostnames internally)
      NEXT_PUBLIC_EXPRESS_API_URL: "http://express:5000"
      NEXT_PUBLIC_DJANGO_API_URL: "http://web:8000"

      # External URLs for redirects / OAuth
      NEXT_PUBLIC_FRONTEND_URL: "http://localhost:3000"

    depends_on:
      - express
      - web

  # =======================
  # 🗄️ MySQL Database
  # =======================
  db:
    image: mysql:8.0
    container_name: sabiway_db
    restart: always
    environment:
      MYSQL_DATABASE: sabiway_db
      MYSQL_USER: sabiway_user
      MYSQL_PASSWORD: sabiway_pass
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
