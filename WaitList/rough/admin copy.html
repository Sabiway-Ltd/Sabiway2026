<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SabiWay Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 sm:p-6">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:gap-x-3 mb-6">
    <img class="md:w-28 w-14 mb-2 sm:mb-0" 
         src="https://res.cloudinary.com/devqbjptr/image/upload/v1758667850/Group_3_2_27_h0iaai.png" 
         alt="SabiWay logo" loading="eager">
    <h1 class="text-2xl sm:text-3xl font-bold">SabiWay Admin Dashboard</h1>
  </div>

  <!-- Add Entry Form -->
  <form id="addForm" 
        class="bg-white p-4 rounded shadow mb-6 grid grid-cols-1 sm:grid-cols-3 gap-2">
    <input type="text" id="name" placeholder="Name" 
           class="border p-2 rounded w-full" required>
    <input type="email" id="email" placeholder="Email" 
           class="border p-2 rounded w-full" required>
    <button class="bg-blue-600 text-white px-4 py-2 rounded w-full sm:w-[60%]">
      Add
    </button>
  </form>

  <!-- Table -->
  <div class="bg-white p-4 rounded shadow">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
      <h2 class="text-lg sm:text-xl font-semibold">Waitlist</h2>
      <a href="http://localhost:5000/api/waitlist/export" 
         class="bg-green-600 text-white px-4 py-2 rounded w-full sm:w-auto text-center">
         ⬇ Download Excel
      </a>
    </div>

    <!-- Make table scrollable on small screens -->
    <div class="overflow-x-auto">
      <table class="min-w-full border text-sm sm:text-base">
        <thead>
          <tr class="bg-gray-200 text-left">
            <th class="p-2 border">ID</th>
            <th class="p-2 border">Name</th>
            <th class="p-2 border">Email</th>
            <th class="p-2 border">Created</th>
            <th class="p-2 border">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Script stays the same -->
  <script>
    const API_URL = "http://localhost:5000/api/waitlist";
    async function fetchData() {
      const res = await fetch(API_URL);
      const data = await res.json();
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      data.data.forEach(entry => {
        const tr = document.createElement("tr");
        tr.setAttribute("data-id", entry.id);

        tr.innerHTML = `
          <td class="p-2 border">${entry.id}</td>
          <td class="p-2 border"><span class="name">${entry.name}</span></td>
          <td class="p-2 border"><span class="email">${entry.email}</span></td>
          <td class="p-2 border">${entry.created_at}</td>
          <td class="p-2 border flex flex-col sm:flex-row gap-2">
            <button onclick="enableEdit(${entry.id})" 
                    class="bg-yellow-500 text-white px-2 py-1 rounded">Edit</button>
            <button onclick="deleteEntry(${entry.id})" 
                    class="bg-red-600 text-white px-2 py-1 rounded">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function addEntry(e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;

      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email })
      });

      document.getElementById("addForm").reset();
      fetchData();
    }

    function enableEdit(id) {
      const row = document.querySelector(`tr[data-id='${id}']`);
      const name = row.querySelector(".name").textContent;
      const email = row.querySelector(".email").textContent;

      row.querySelector(".name").innerHTML =
        `<input type="text" value="${name}" class="border p-1 rounded w-full" id="edit-name-${id}">`;
      row.querySelector(".email").innerHTML =
        `<input type="email" value="${email}" class="border p-1 rounded w-full" id="edit-email-${id}">`;

      row.querySelector("td:last-child").innerHTML = `
        <div class="flex flex-col sm:flex-row gap-2">
          <button onclick="saveEdit(${id})" 
                  class="bg-green-600 text-white px-2 py-1 rounded">Save</button>
          <button onclick="cancelEdit(${id}, '${name}', '${email}')" 
                  class="bg-gray-500 text-white px-2 py-1 rounded">Cancel</button>
        </div>
      `;
    }

    async function saveEdit(id) {
      const name = document.getElementById(`edit-name-${id}`).value;
      const email = document.getElementById(`edit-email-${id}`).value;

      await fetch(`${API_URL}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email })
      });

      fetchData();
    }

    function cancelEdit(id, name, email) {
      const row = document.querySelector(`tr[data-id='${id}']`);
      row.querySelector(".name").textContent = name;
      row.querySelector(".email").textContent = email;

      row.querySelector("td:last-child").innerHTML = `
        <div class="flex flex-col sm:flex-row gap-2">
          <button onclick="enableEdit(${id})" 
                  class="bg-yellow-500 text-white px-2 py-1 rounded">Edit</button>
          <button onclick="deleteEntry(${id})" 
                  class="bg-red-600 text-white px-2 py-1 rounded">Delete</button>
        </div>
      `;
    }

    async function deleteEntry(id) {
      await fetch(`${API_URL}/${id}`, { method: "DELETE" });
      fetchData();
    }

    document.getElementById("addForm").addEventListener("submit", addEntry);
    fetchData();
  </script>
</body>
</html>
