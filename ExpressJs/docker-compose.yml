version: "3.9"

services:
  express:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_app

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      DJANGO_URL: "http://172.17.0.1:8000"  # local docker network access to Django

    # Healthcheck to auto-restart container if Express hangs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    # Optional: limit memory usage so Express never crashes VPS
    deploy:
      resources:
        limits:
          memory: 512M
